name: Android CI/CD

on:
  push:
    branches: [ rewrite, main, develop ]
  pull_request:
    branches: [ rewrite, main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleAfatDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: overgram-debug
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
          retention-days: 30

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app-release.keystore
          fi

      - name: Create keystore.properties
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "app-release.keystore" ]; then
            cat > keystore.properties <<EOF
          storeFile=../app-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi

      - name: Build Release APK
        run: ./gradlew assembleAfatRelease

      - name: Sign APK
        if: github.event_name != 'pull_request' && hashFiles('app-release.keystore') != ''
        run: |
          $ANDROID_HOME/build-tools/33.0.2/zipalign -v 4 \
            TMessagesProj/build/outputs/apk/afat/release/*.apk \
            overgram-release-aligned.apk

          $ANDROID_HOME/build-tools/33.0.2/apksigner sign \
            --ks app-release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out overgram-signed.apk \
            overgram-release-aligned.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: overgram-release
          path: |
            TMessagesProj/build/outputs/apk/afat/release/*.apk
            overgram-signed.apk
          retention-days: 30

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-debug

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run Lint
        run: ./gradlew lint

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TMessagesProj/build/reports/tests/
            TMessagesProj/build/reports/lint-results*.html
          retention-days: 14

  build-bundle:
    name: Build AAB Bundle
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AAB
        run: ./gradlew bundleAfatRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: overgram-bundle
          path: TMessagesProj/build/outputs/bundle/afatRelease/*.aab
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release, test, build-bundle]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/rewrite')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: overgram-debug
          path: artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: overgram-release
          path: artifacts/release

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: overgram-bundle
          path: artifacts/bundle

      - name: Get Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="nightly-$(date +%Y%m%d)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Overgram Android ${{ steps.version.outputs.version }}
          body: |
            ## Overgram for Android

            **Developed by [@overspend1](https://github.com/overspend1)**

            ### 🎨 Features
            - Liquid Glass design system
            - Full ghost mode
            - Message history database
            - Material You theming

            ### 📦 Downloads
            - **overgram-signed.apk** - Recommended for most users
            - **overgram-debug.apk** - For debugging
            - **overgram-bundle.aab** - For Play Store

            ### 📱 Installation
            1. Download the signed APK
            2. Enable "Unknown Sources" in Settings
            3. Install the APK

            Built with GitHub Actions
          files: |
            artifacts/debug/*.apk
            artifacts/release/*.apk
            artifacts/bundle/*.aab
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-telegram-build:
    name: Notify Build Complete
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && success()

    steps:
      - name: Send Build Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            MESSAGE="🔨 Build completed%0A%0A"
            MESSAGE+="Branch: ${GITHUB_REF#refs/heads/}%0A"
            MESSAGE+="Commit: ${GITHUB_SHA:0:7}%0A"
            MESSAGE+="View: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

            curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=true" || echo "Notification skipped"
          fi

  notify-telegram-release:
    name: Notify New Release
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/rewrite')

    steps:
      - name: Get Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="nightly-$(date +%Y%m%d)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Send Release Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            # Construct download URLs
            RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
            SIGNED_APK="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/overgram-signed.apk"

            # Create message with HTML formatting
            MESSAGE="🚀 <b>Overgram Android $VERSION</b>%0A%0A"
            MESSAGE+="New release is now available!%0A%0A"
            MESSAGE+="<b>✨ What's New:</b>%0A"
            MESSAGE+="• Liquid Glass design system%0A"
            MESSAGE+="• Full ghost mode%0A"
            MESSAGE+="• Message history database%0A"
            MESSAGE+="• Material You theming%0A%0A"
            MESSAGE+="<b>📥 Download:</b>%0A"
            MESSAGE+="<a href=\"$SIGNED_APK\">📱 Download APK</a>%0A%0A"
            MESSAGE+="<b>📖 Full Release Notes:</b>%0A"
            MESSAGE+="<a href=\"$RELEASE_URL\">View on GitHub</a>%0A%0A"
            MESSAGE+="👨‍💻 Developed by @overspend1%0A"
            MESSAGE+="💬 Join: @overgramchat"

            curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=false" || echo "Notification skipped"
          else
            echo "Telegram notification skipped (no token)"
          fi
