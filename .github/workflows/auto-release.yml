name: Auto Release & Telegram Upload

on:
  push:
    branches:
      - main
      - rewrite
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-and-release:
    name: Build & Auto Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2
            ndk;21.4.7075529
            cmake;3.22.1

      - name: Create build config files
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          MAPS_V2_API: ${{ secrets.MAPS_V2_API }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat > API_KEYS <<EOF
          APP_ID=${APP_ID:-26796489}
          APP_HASH="${APP_HASH:-1aa77ae19cb7295735e896b6a6712bdd}"
          MAPS_V2_API="${MAPS_V2_API:-AIzaSyDummyKeyForLocalBuild}"
          SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD:-overgram123}
          SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS:-overgram}
          SIGNING_KEY_STORE_PASSWORD=${SIGNING_KEY_STORE_PASSWORD:-overgram123}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version and build type
        id: version
        run: |
          # Determine if this is a release or beta build
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            # Tagged release
            VERSION=${GITHUB_REF#refs/tags/v}
            BUILD_TYPE="release"
            IS_PRERELEASE="false"
            TAG_NAME="v${VERSION}"
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            # Main branch - stable release
            VERSION=$(date +"%Y.%m.%d")
            BUILD_TYPE="release"
            IS_PRERELEASE="false"
            TAG_NAME="v${VERSION}"
          else
            # Develop/rewrite branch - beta build
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            VERSION="beta-$(date +"%Y%m%d-%H%M")"
            BUILD_TYPE="beta"
            IS_PRERELEASE="true"
            TAG_NAME="${VERSION}"
          fi

          BUILD_DATE=$(date +"%Y-%m-%d %H:%M UTC")

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

          echo "📦 Version: $VERSION"
          echo "🏷️  Tag: $TAG_NAME"
          echo "🔨 Build Type: $BUILD_TYPE"

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app-release.keystore
          echo "✅ Keystore decoded"

      - name: Create keystore.properties
        if: hashFiles('app-release.keystore') != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=../app-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "✅ Keystore properties created"

      - name: Build Release APK
        run: |
          echo "🔨 Building release APK..."
          ./gradlew assembleAfatRelease --no-daemon
          echo "🔨 Building Play Store bundle..."
          ./gradlew bundleAfatRelease --no-daemon
          echo "✅ Build complete"

      - name: Sign APK
        id: sign
        if: hashFiles('app-release.keystore') != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_PATH=$(find TMessagesProj/build/outputs/apk/afat/release -name "*.apk" -type f | head -1)

          if [ -f "$APK_PATH" ]; then
            echo "📝 Signing APK: $APK_PATH"

            # Align
            $ANDROID_HOME/build-tools/33.0.2/zipalign -v 4 \
              "$APK_PATH" \
              overgram-aligned.apk

            # Sign
            $ANDROID_HOME/build-tools/33.0.2/apksigner sign \
              --ks app-release.keystore \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out overgram-signed.apk \
              overgram-aligned.apk

            # Verify
            $ANDROID_HOME/build-tools/33.0.2/apksigner verify overgram-signed.apk

            echo "✅ APK signed successfully"
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "apk_path=overgram-signed.apk" >> $GITHUB_OUTPUT
          else
            echo "❌ APK not found"
            exit 1
          fi

      - name: Prepare unsigned APK
        id: unsigned
        if: steps.sign.outputs.signed != 'true'
        run: |
          APK_PATH=$(find TMessagesProj/build/outputs/apk/afat/release -name "*.apk" -type f | head -1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" overgram-unsigned.apk
            echo "⚠️  Using unsigned APK"
            echo "apk_path=overgram-unsigned.apk" >> $GITHUB_OUTPUT
          fi

      - name: Get APK info
        id: apk_info
        run: |
          if [ -f "overgram-signed.apk" ]; then
            APK_FILE="overgram-signed.apk"
            APK_NAME="Overgram-${{ steps.version.outputs.version }}-signed.apk"
          else
            APK_FILE="overgram-unsigned.apk"
            APK_NAME="Overgram-${{ steps.version.outputs.version }}-unsigned.apk"
          fi

          FILE_SIZE=$(ls -lh "$APK_FILE" | awk '{print $5}')

          # Rename for release
          cp "$APK_FILE" "$APK_NAME"

          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

          echo "📦 APK: $APK_NAME ($FILE_SIZE)"

          FILES="$APK_NAME"
          BUNDLE_PATH=$(find TMessagesProj/build/outputs/bundle/afatRelease -name "*.aab" -type f | head -1)
          if [ -n "$BUNDLE_PATH" ]; then
            BUNDLE_NAME="Overgram-${{ steps.version.outputs.version }}.aab"
            cp "$BUNDLE_PATH" "$BUNDLE_NAME"
            echo "bundle_name=$BUNDLE_NAME" >> $GITHUB_OUTPUT
            echo "bundle_path=$BUNDLE_NAME" >> $GITHUB_OUTPUT
            FILES="$FILES
$BUNDLE_NAME"
            echo "📦 AAB: $BUNDLE_NAME"
          else
            echo "bundle_name=" >> $GITHUB_OUTPUT
            echo "bundle_path=" >> $GITHUB_OUTPUT
          fi

          {
            echo "release_files<<'EOF'"
            echo "$FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        run: |
          if [[ "${{ steps.version.outputs.build_type }}" == "beta" ]]; then
            NOTES="## 🧪 Beta Build - Overgram Android ${{ steps.version.outputs.version }}

**⚠️ This is a beta/development build**

### 📦 Build Information
- **Build Date:** ${{ steps.version.outputs.build_date }}
- **Build Number:** #${{ github.run_number }}
- **Commit:** \`${GITHUB_SHA:0:7}\`
- **Branch:** \`${GITHUB_REF#refs/heads/}\`

### ✨ Features
- 🎨 Liquid Glass design system with real glassmorphism
- 👻 Full ghost mode for privacy
- 💾 Message history database (saves edits & deletions)
- 🎨 Material You theming (Android 12+)
- 🔒 Local encryption & biometric lock
- ⚡ GPU-accelerated rendering
- 🚀 Local Telegram Premium features

### 📱 Installation
1. Download the APK below
2. Enable \"Unknown Sources\" in Android settings
3. Install and enjoy!

### ⚠️ Beta Notes
This is an automated beta build from the development branch. It may contain:
- Experimental features
- Known bugs
- Performance issues

**Use at your own risk!** Keep backups of important data.

### 🔗 Links
- 🌐 Website: [overgram.one](https://overgram.one)
- 📱 Channel: [@overgramupdates](https://t.me/overgramupdates)
- 💬 Chat: [@overgramchat](https://t.me/overgramchat)
- 📖 Docs: [docs.overgram.one](https://docs.overgram.one)

---

**Developed by [@overspend1](https://github.com/overspend1)** | Built with GitHub Actions"
          else
            NOTES="## 🚀 Overgram Android ${{ steps.version.outputs.version }}

### ✨ What's New
- 🎨 Liquid Glass design system with real glassmorphism
- 👻 Full ghost mode for privacy
- 💾 Message history database (saves edits & deletions)
- 🎨 Material You theming (Android 12+)
- 🔒 Local encryption & biometric lock
- ⚡ GPU-accelerated rendering
- 🚀 Local Telegram Premium features

### 📦 Download
Choose the appropriate APK for your device:
- **overgram-signed.apk** - Recommended for all users
- File size: ${{ steps.apk_info.outputs.file_size }}

### 📱 Installation
1. Download the APK below
2. Enable \"Unknown Sources\" in Android settings
3. Install and enjoy!

### 🔗 Links
- 🌐 Website: [overgram.one](https://overgram.one)
- 📱 Channel: [@overgramupdates](https://t.me/overgramupdates)
- 💬 Chat: [@overgramchat](https://t.me/overgramchat)
- 📖 Docs: [docs.overgram.one](https://docs.overgram.one)

---

**Developed by [@overspend1](https://github.com/overspend1)** | Built with GitHub Actions"
          fi

          # Save to file
          echo "$NOTES" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Overgram Android ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: ${{ steps.apk_info.outputs.release_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          APK_FILE="${{ steps.apk_info.outputs.apk_file }}"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"

          if [ -f "$APK_FILE" ]; then
            echo "📱 Uploading APK to Telegram channel..."

            # Check file size (Telegram limit: 50MB)
            FILE_SIZE_BYTES=$(stat -c%s "$APK_FILE")
            FILE_SIZE_MB=$((FILE_SIZE_BYTES / 1024 / 1024))

            if [ $FILE_SIZE_MB -gt 50 ]; then
              echo "⚠️  APK too large for Telegram (${FILE_SIZE_MB}MB > 50MB)"
              echo "Sending notification with download link instead..."

              RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ steps.version.outputs.tag_name }}"
              MESSAGE="🚀 <b>Overgram Android ${VERSION}</b>%0A%0A"
              MESSAGE+="⚠️ APK too large for direct upload (${FILE_SIZE_MB}MB)%0A%0A"
              MESSAGE+="<b>📥 Download from GitHub:</b>%0A"
              MESSAGE+="<a href=\"${RELEASE_URL}\">Download Release</a>%0A%0A"
              MESSAGE+="👨‍💻 By @overspend1 • 💬 @overgramchat"

              curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
                -d "text=${MESSAGE}" \
                -d "parse_mode=HTML"
            else
              # Build type emoji
              if [ "$BUILD_TYPE" == "beta" ]; then
                EMOJI="🧪"
                TYPE_TEXT="Beta Build"
              else
                EMOJI="🚀"
                TYPE_TEXT="Release"
              fi

              # Create caption
              CAPTION="${EMOJI} <b>Overgram Android ${VERSION}</b>

<b>Type:</b> ${TYPE_TEXT}
<b>Build:</b> #${{ github.run_number }} • ${{ steps.version.outputs.build_date }}
<b>Size:</b> ${{ steps.apk_info.outputs.file_size }}

<b>✨ Features:</b>
• Liquid Glass design system
• Full ghost mode
• Message history database
• Material You theming
• Local encryption & biometric lock

<b>📱 Installation:</b>
1. Download APK above
2. Enable Unknown Sources
3. Install and enjoy!

<b>🔗 Links:</b>
• Website: overgram.one
• GitHub: github.com/overspend1/Overgram4A

👨‍💻 By @overspend1 • 💬 @overgramchat"

              # Upload to Telegram
              HTTP_CODE=$(curl -s -o /tmp/telegram_response.json -w "%{http_code}" \
                -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
                -F "document=@${APK_FILE}" \
                -F "caption=${CAPTION}" \
                -F "parse_mode=HTML" \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")

              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "✅ APK uploaded successfully to Telegram!"
                cat /tmp/telegram_response.json | jq '.' || cat /tmp/telegram_response.json
              else
                echo "❌ Failed to upload APK to Telegram (HTTP $HTTP_CODE)"
                cat /tmp/telegram_response.json

                # Try sending a notification with link instead
                RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ steps.version.outputs.tag_name }}"
                MESSAGE="${EMOJI} <b>Overgram Android ${VERSION}</b>%0A%0A"
                MESSAGE+="New ${TYPE_TEXT,,} is available!%0A%0A"
                MESSAGE+="<b>📥 Download:</b>%0A"
                MESSAGE+="<a href=\"${RELEASE_URL}\">Download from GitHub</a>%0A%0A"
                MESSAGE+="👨‍💻 By @overspend1 • 💬 @overgramchat"

                curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
                  -d "text=${MESSAGE}" \
                  -d "parse_mode=HTML" || echo "⚠️  Both upload and notification failed"
              fi
            fi
          else
            echo "❌ APK file not found: $APK_FILE"
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: overgram-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.apk_info.outputs.apk_name }}
            ${{ steps.apk_info.outputs.bundle_name }}
          retention-days: 30

      - name: Upload AAB as artifact
        if: steps.apk_info.outputs.bundle_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: overgram-aab-${{ steps.version.outputs.version }}
          path: ${{ steps.apk_info.outputs.bundle_name }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.version.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ steps.version.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ${{ steps.apk_info.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${{ steps.apk_info.outputs.file_size }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ steps.create_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "✅ Uploaded to Telegram channel" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Telegram upload skipped (no bot token)" >> $GITHUB_STEP_SUMMARY
          fi
